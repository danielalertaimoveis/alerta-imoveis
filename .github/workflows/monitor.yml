name: Monitor de imóveis

on:
  schedule:
    # Horários em UTC. Brasília = UTC-3.
    - cron: "*/10 10-23 * * *"   # das 7h às 20h59: a cada 10 minutos
    - cron: "5 0-9 * * *"        # das 21h às 6h59: uma vez por hora
  workflow_dispatch:
    inputs:
      teste:
        description: "Enviar só uma mensagem de teste"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verificar anúncios
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USUARIO: ${{ secrets.EMAIL_USUARIO }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          SO_TESTE: ${{ inputs.teste }}
        run: |
          if [ "$SO_TESTE" = "true" ]; then
            python3 monitor.py --teste
          else
            python3 monitor.py
          fi

      - name: Guardar o que já foi visto
        if: always()
        run: |
          [ -d estado ] || exit 0
          git config user.name "monitor"
          git config user.email "monitor@users.noreply.github.com"
          git add estado
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza anúncios vistos"
          # se o código foi atualizado enquanto a verificação rodava, encaixa por cima antes de enviar
          git pull --quiet --rebase origin main
          git push
